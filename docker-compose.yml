services:
  backend:
    build: ./backend
    image: cloud-web-app-backend:latest
    container_name: cloud-web-app-container
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: cloud-web-app-frontend:latest
    container_name: cloud-web-app-frontend-container
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped