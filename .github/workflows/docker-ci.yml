name: Docker CI Tests Security and Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_BACKEND: cloud-web-app-backend
  ECR_FRONTEND: cloud-web-app-frontend

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start application
        run: docker compose up -d --build

      - name: Test backend health endpoint
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Test contacts API
        run: curl -fsS http://localhost:3000/api/contacts

      - name: Scan backend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloud-web-app-backend:latest
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan frontend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloud-web-app-frontend:latest
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push backend image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag cloud-web-app-backend:latest "$ECR_REGISTRY/$ECR_BACKEND:latest"
          docker push "$ECR_REGISTRY/$ECR_BACKEND:latest"

      - name: Push frontend image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag cloud-web-app-frontend:latest "$ECR_REGISTRY/$ECR_FRONTEND:latest"
          docker push "$ECR_REGISTRY/$ECR_FRONTEND:latest"

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: piyush491194
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag cloud-web-app-backend:latest piyush491194/cloud-web-app-backend:latest
          docker push piyush491194/cloud-web-app-backend:latest

      - name: Push frontend image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag cloud-web-app-frontend:latest piyush491194/cloud-web-app-frontend:latest
          docker push piyush491194/cloud-web-app-frontend:latest

      - name: Stop application
        if: always()
        run: docker compose down