```yaml
name: Docker CI, Tests and AWS ECR Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  docker-ci:
    name: Build and Test Docker Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Start Application
        run: docker compose up -d --build

      - name: Test Backend Health
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:3000/health; then
              echo "Backend health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Backend health check failed"
          docker compose logs
          exit 1

      - name: Test Frontend
        run: |
          curl --fail http://localhost:8080/

      - name: Stop Application
        if: always()
        run: docker compose down

  push-to-ecr:
    name: Authenticate and Push Images to AWS ECR
    needs: docker-ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Temporary diagnostic step.
      # Prints only the subject and audience claims, never the JWT.
      - name: Debug OIDC Claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(`OIDC subject: ${payload.sub}`);
            core.info(`OIDC audience: ${payload.aud}`);

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image
        env:
          AWS_ACCOUNT_ID: "459547397576"
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          docker build -t cloud-web-app-backend:latest ./backend
          docker tag cloud-web-app-backend:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/cloud-web-app-backend:latest
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/cloud-web-app-backend:latest

      - name: Build and Push Frontend Image
        env:
          AWS_ACCOUNT_ID: "459547397576"
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          docker build -t cloud-web-app-frontend:latest ./frontend
          docker tag cloud-web-app-frontend:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/cloud-web-app-frontend:latest
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/cloud-web-app-frontend:latest
```
