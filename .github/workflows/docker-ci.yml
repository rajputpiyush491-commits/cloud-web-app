name: Docker CI Tests Security and Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start application
        run: docker compose up -d --build

      - name: Test backend health endpoint
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Test contacts API
        run: curl -fsS http://localhost:3000/api/contacts

      - name: Scan backend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloud-web-app-backend:latest
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan frontend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloud-web-app-frontend:latest
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: piyush491194
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag cloud-web-app-backend:latest piyush491194/cloud-web-app-backend:latest
          docker push piyush491194/cloud-web-app-backend:latest

      - name: Push frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag cloud-web-app-frontend:latest piyush491194/cloud-web-app-frontend:latest
          docker push piyush491194/cloud-web-app-frontend:latest

      - name: Stop application
        if: always()
        run: docker compose down
