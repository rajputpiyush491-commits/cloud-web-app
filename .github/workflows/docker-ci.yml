
name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t cloud-web-app-backend ./backend

      - name: Build frontend image
        run: docker build -t cloud-web-app-frontend ./frontend
