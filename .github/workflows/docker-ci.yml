name: Docker CI, Tests and Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start application
        run: docker compose up -d --build

      - name: Test backend health endpoint
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Test contacts API
        run: curl -fsS http://localhost:3000/api/contacts

      - name: Scan backend Docker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cloud-web-app-backend:latest
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan frontend Docker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cloud-web-app-frontend:latest
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Stop application
        if: always()
        run: docker compose down